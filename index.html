<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Loan Application</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #4CAF50; color: white; padding: 10px; border: none; border-radius: 4px; margin-top: 15px; font-size: 16px; cursor: pointer; }
        button:hover { background: #45a049; }
        #msg { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Online Loan Form</h2>
    <form id="loanForm">
        <label>නම (Full Name):</label>
        <input type="text" id="name" required>

        <label>දුරකථන අංකය (Phone Number):</label>
        <input type="tel" id="phone" required>

        <label>ඉල්ලන ණය මුදල (Loan Amount):</label>
        <input type="number" id="amount" required>

        <button type="submit">Loan එක ඉල්ලන්න (Apply)</button>
    </form>
    <p id="msg"></p>
</div>

<!-- Firebase SDKs සහ Configuration -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getFirestore, collection, addfDoc, addDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDWKMaMx3QwAtrqA9J_BFiWBgkp_Dh-a-Q",
      authDomain: "online-loane-fe59a.firebaseapp.com",
      projectId: "online-loane-fe59a",
      storageBucket: "online-loane-fe59a.firebasestorage.app",
      messagingSenderId: "571453511861",
      appId: "1:571453511861:web:1151d187296b1aa2f586fc",
      measurementId: "G-9CJ8V1GDVH"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("loanForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("name").value;
        const phone = document.getElementById("phone").value;
        const amount = document.getElementById("amount").value;
        const msg = document.getElementById("msg");

        try {
            await addDoc(collection(db, "loans"), {
                name: name,
                phone: phone,
                amount: amount,
                status: "Pending", // අලුතින් එන ඒවා Pending වැටෙයි
                createdAt: new Date()
            });
            msg.style.color = "green";
            msg.innerText = "සාර්ථකයි! ඔබේ ණය ඉල්ලීම යොමු විය.";
            document.getElementById("loanForm").reset();
        } catch (error) {
            msg.style.color = "red";
            msg.innerText = "දෝෂයක් සිදු විය: " + error.message;
        }
    });
</script>

</body>
</html>
