<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Loan Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #msg {
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Online Loan Form</h2>
        <form id="loanForm">
            <div class="form-group">
                <label for="name">නම (Full Name):</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="phone">දුරකථන අංකය (Phone Number):</label>
                <input type="text" id="phone" required>
            </div>
            <div class="form-group">
                <label for="amount">ඉල්ලන ණය මුදල (Loan Amount):</label>
                <input type="number" id="amount" required>
            </div>
            <button type="submit">Loan එක ඉල්ලන්න (Apply)</button>
        </form>
        
        <!-- මැසේජ් එක ලොකුවට පේන තැන -->
        <div id="msg"></div>
    </div>

    <!-- Firebase සහ JavaScript කෝඩ් එක -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDWKMaMx3QwAtrqA9J_BFiWBgkp_Dh-a-Q",
          authDomain: "online-loane-fe59a.firebaseapp.com",
          projectId: "online-loane-fe59a",
          storageBucket: "online-loane-fe59a.firebasestorage.app",
          messagingSenderId: "571453511861",
          appId: "1:571453511861:web:1151d187296b1aa2f586fc",
          measurementId: "G-9CJ8V1GDVH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById("loanForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("name").value;
            const phone = document.getElementById("phone").value;
            const amount = document.getElementById("amount").value;
            const msg = document.getElementById("msg");

            try {
                await addDoc(collection(db, "loans"), {
                    name: name,
                    phone: phone,
                    amount: amount,
                    status: "Pending",
                    createdAt: new Date()
                });

                // ලොකුවට සහ පැහැදිලිව මැසේජ් එක පෙන්වීම
                msg.style.display = "block";
                msg.style.background = "#d4edda";
                msg.style.color = "#155724";
                msg.style.padding = "15px";
                msg.style.borderRadius = "5px";
                msg.style.fontSize = "16px";
                msg.style.fontWeight = "bold";
                msg.style.textAlign = "center";
                msg.style.border = "1px solid #c3e6cb";
                msg.innerText = "✨ ඔබගේ ණය ඉල්ලීම සාර්ථකයි! පරීක්ෂා කර බලා දන්වන්නම්.";

                document.getElementById("loanForm").reset();
            } catch (error) {
                msg.style.display = "block";
                msg.style.background = "#f8d7da";
                msg.style.color = "#721c24";
                msg.style.padding = "15px";
                msg.style.borderRadius = "5px";
                msg.innerText = "දෝෂයක් සිදු විය: " + error.message;
            }
        });
    </script>
</body>
</html>
