<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Loans</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 14px; }
        th { background: #007BFF; color: white; }
        .approve-btn { background: #28a745; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
        .reject-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Admin Panel - Loan Requests</h2>
    <table>
        <thead>
            <tr>
                <th>නම</th>
                <th>දුරකථන අංකය</th>
                <th>මුදල</th>
                <th>තත්වය (Status)</th>
                <th>ක්‍රියාමාර්ග</th>
            </tr>
        </thead>
        <tbody id="loanTableBody">
            <!-- ඩේටා මෙතනට ලෝඩ් වෙයි -->
        </tbody>
    </table>
</div>

<!-- Firebase SDKs සහ Configuration -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDWKMaMx3QwAtrqA9J_BFiWBgkp_Dh-a-Q",
      authDomain: "online-loane-fe59a.firebaseapp.com",
      projectId: "online-loane-fe59a",
      storageBucket: "online-loane-fe59a.firebasestorage.app",
      messagingSenderId: "571453511861",
      appId: "1:571453511861:web:1151d187296b1aa2f586fc",
      measurementId: "G-9CJ8V1GDVH"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadLoans() {
        const tableBody = document.getElementById("loanTableBody");
        tableBody.innerHTML = "";
        
        const querySnapshot = await getDocs(collection(db, "loans"));
        querySnapshot.forEach((document) => {
            const data = document.data();
            const id = document.id;

            let row = `<tr>
                <td>${data.name}</td>
                <td>${data.phone}</td>
                <td>Rs. ${data.amount}</td>
                <td id="status-${id}">${data.status}</td>
                <td>
                    <button class="approve-btn" onclick="updateStatus('${id}', 'Approved')">Approve</button>
                    <button class="reject-btn" onclick="updateStatus('${id}', 'Rejected')">Reject</button>
                </td>
            </tr>`;
            tableBody.innerHTML += row;
        });
    }

    window.updateStatus = async function(id, newStatus) {
        try {
            const loanRef = doc(db, "loans", id);
            await updateDoc(loanRef, { status: newStatus });
            document.getElementById(`status-${id}`).innerText = newStatus;
            alert("ਸාර්ථකයි! ස්ටේටස් එක වෙනස් විය.");
        } catch (error) {
            alert("දෝෂයක් සිදු විය: " + error.message);
        }
    }

    loadLoans();
</script>

</body>
</html>
